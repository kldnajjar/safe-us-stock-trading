name: Bug report
description: The engine, a screen or an output did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Remove personal holdings, balances and account details before posting.** For anything that lets a plan bypass a safety gate, use private reporting instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and inputs to reproduce
      description: The exact script command and (anonymised) JSON inputs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: run_checks.py output
      render: json
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: "v4.6"
