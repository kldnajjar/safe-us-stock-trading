name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Files, registries and all tests
        run: python3 safe-us-stock-trading/scripts/run_checks.py
